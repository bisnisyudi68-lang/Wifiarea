<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard Konter</title>

<style>

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f2f2f2;
}

header{
  background:#0d6efd;
  color:white;
  text-align:center;
  padding:25px;
}

.tabs{
  display:flex;
  gap:10px;
  padding:15px;
}

.tabs button{
  flex:1;
  border:none;
  padding:14px;
  border-radius:12px;
  background:white;
  color:#0d6efd;
  font-size:18px;
  font-weight:bold;
}

.tabs button.active{
  background:#0d6efd;
  color:white;
}

.box{
  display:none;
  background:white;
  margin:15px;
  padding:20px;
  border-radius:16px;
}

.box.active{
  display:block;
}

.item{
  border-bottom:1px solid #ddd;
  padding:18px 0;
}

.tgl{
  color:#666;
  font-size:15px;
}

.total{
  font-size:28px;
  font-weight:bold;
  margin-top:5px;
}
body{font-family:Arial;background:#f2f2f2;margin:0}

header{background:#0d47a1;color:white;padding:15px;text-align:center}

input{width:95%;margin:10px;padding:12px;font-size:16px}

.card{background:white;margin:10px;padding:12px;border-radius:8px}

.big{font-size:20px;font-weight:bold}

.harga{color:red;font-weight:bold}
.stok{color:green}
h3{
  text-align: center;
  font-weight: bold;
  margin-top: 15px;
}


</style>
</head>
<header>
<h2>A-Yudi-Thea</h2>
<p>Dashboard & Stok Produk</p>
</header>
<body>
<!-- DASHBOARD -->
<h3>📅 Data Harian</h3>
<input type="date" id="tgl" onchange="filterTanggal()">

<div class="card">Omset<div class="big" id="omset">Rp 0</div></div>
<div class="card">Pengeluaran<div class="big" id="keluar">Rp 0</div></div>
<div class="card">Laba<div class="big" id="laba">Rp 0</div></div>

<hr>

<header>
  <h1>📊 Dashboard Konter</h1>
  <p>Data dari Sheet FIX RUMUS1</p>
</header>

<div class="tabs">

  <button
    class="active"
    id="btnHarian"
    onclick="showTab('harian')">
    Harian
  </button>

  <button
    id="btnBulanan"
    onclick="showTab('bulanan')">
    Bulanan
  </button>

  <button
    id="btnTahunan"
    onclick="showTab('tahunan')">
    Tahunan
  </button>

</div>

<div id="harian" class="box active">
  <h2>📅 Data Harian</h2>
  <div id="harianList">Loading...</div>
</div>

<div id="bulanan" class="box">
  <h2>🗓️ Data Bulanan</h2>
  <div id="bulananList">Loading...</div>
</div>

<div id="tahunan" class="box">
  <h2>📆 Data Tahunan</h2>
  <div id="tahunanList">Loading...</div>
</div>

<script>

function showTab(id){

  document.querySelectorAll(".box").forEach(el=>{
    el.classList.remove("active");
  });

  document.querySelectorAll(".tabs button").forEach(el=>{
    el.classList.remove("active");
  });

  document.getElementById(id).classList.add("active");

  document.getElementById(
    "btn" +
    id.charAt(0).toUpperCase() +
    id.slice(1)
  ).classList.add("active");
}

const CSV_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vTAP_R50frV13whqx54ctjplc-8xhcN53rHEVk5mkhLeZE283xWnr6TdTBFr-KFymEiaYE_NWgGthpo/pub?gid=1848020631&single=true&output=csv";

function rupiah(angka){
  return "Rp " + angka.toLocaleString("id-ID");
}

fetch(CSV_URL)
.then(res => res.text())
.then(csv => {

  const lines = csv.trim().split("\n");

  const headers = lines[0]
    .split(",")
    .map(h => h.replace(/"/g,"").trim().toUpperCase());

  const idxTanggal = headers.indexOf("TANGGAL");
  const idxBulan   = headers.indexOf("BULAN");
  const idxTahun   = headers.indexOf("TAHUN");
  const idxTotal   = headers.indexOf("TOTAL HARGA");

  let harian = {};
  let bulanan = {};
  let tahunan = {};

  lines.slice(1).forEach(row => {

    const c = row.split(",");

    const tanggal =
      (c[idxTanggal] || "")
      .replace(/"/g,"")
      .trim();

    const bulan =
      (c[idxBulan] || "")
      .replace(/"/g,"")
      .trim();

    const tahun =
      (c[idxTahun] || "")
      .replace(/"/g,"")
      .trim();

    const total =
      parseInt(
        (c[idxTotal] || "")
        .replace(/"/g,"")
        .replace(/[^\d]/g,"")
      ) || 0;

    if(!tanggal || total <= 0) return;

    harian[tanggal] =
      (harian[tanggal] || 0) + total;

    const namaBulan =
      bulan + " " + tahun;

    bulanan[namaBulan] =
      (bulanan[namaBulan] || 0) + total;

    tahunan[tahun] =
      (tahunan[tahun] || 0) + total;

  });

  let hHtml = "";

  Object.keys(harian).forEach(tgl => {

    hHtml += `
      <div class="item">
        <div class="tgl">${tgl}</div>
        <div class="total">${rupiah(harian[tgl])}</div>
      </div>
    `;

  });

  document.getElementById("harianList").innerHTML = hHtml;

  let bHtml = "";

  Object.keys(bulanan).forEach(bln => {

    bHtml += `
      <div class="item">
        <div class="tgl">${bln}</div>
        <div class="total">${rupiah(bulanan[bln])}</div>
      </div>
    `;

  });

  document.getElementById("bulananList").innerHTML = bHtml;

  let tHtml = "";

  Object.keys(tahunan).forEach(thn => {

    tHtml += `
      <div class="item">
        <div class="tgl">${thn}</div>
        <div class="total">${rupiah(tahunan[thn])}</div>
      </div>
    `;

  });

  document.getElementById("tahunanList").innerHTML = tHtml;

})
.catch(err => {

  document.getElementById("harianList").innerHTML =
    "Gagal memuat data";

  console.error(err);

});
const sheetId="1iPbtRGldW5yz6tuUZ5oHzMGsnNb4cHyCbAEMkq51qK4";
const tabLaporan="FIX RUMUS1";

fetch(`https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?sheet=${encodeURIComponent(tabLaporan)}`)
.then(r=>r.text())
.then(t=>{
const json=JSON.parse(t.substring(47).slice(0,-2));
window.rowsLaporan=json.table.rows;
});

function filterTanggal(){
let pilih=tgl.value;
let om=0, ke=0;

rowsLaporan.forEach(r=>{
let d=r.c[0]?.f||r.c[0]?.v||"";
if(d.includes("/")){
let p=d.split("/");
d=`${p[2]}-${p[1]}-${p[0]}`;
}
if(d===pilih){
om+=Number(r.c[11]?.v||0);
ke+=Number(r.c[12]?.v||0);
}
});

omset.innerText="Rp "+om;
keluar.innerText="Rp "+ke;
laba.innerText="Rp "+(om-ke);
}

</script>

</body>
</html>
